name = "livres-de-jean-payments"
main = "src/worker.ts"
compatibility_date = "2026-05-03"

[[d1_databases]]
binding = "DB"
database_name = "livres_de_jean"
database_id = "16181fe9-b0a5-4f20-979b-68c745f2c03d"

[[r2_buckets]]
binding = "PDFS"
bucket_name = "ebooks-jean"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ebooks-jean"

[vars]
PAYPAL_API_BASE="https://api-m.paypal.com"
SITE_URL = "https://pmourey.github.io/Livres-de-Jean"
STRIPE_RETURN_URL = "https://pmourey.github.io/Livres-de-Jean/?payment=stripe-success"
STRIPE_CANCEL_URL = "https://pmourey.github.io/Livres-de-Jean/?payment=stripe-cancel"
# PAYPAL_RETURN_URL = "https://livres-de-jean-payments.super-violet-dc40.workers.dev/checkout/paypal/complete"
PAYPAL_RETURN_URL = "https://livres-de-jean-payments.super-violet-dc40.workers.dev/checkout/paypal/complete"
PAYPAL_SUCCESS_URL = "https://pmourey.github.io/Livres-de-Jean/"

# Configuration SMTP Gmail pour envois de codes OTP, notifications de commandes et réclamations
SMTP_SERVER = "smtp.gmail.com"
SMTP_PORT = "465"
GMAIL_FULLNAME = "Philippe Mourey"
GMAIL_USER = "philippe.mourey@gmail.com"
# Pour le mot de passe d'application Gmail à 16 caractères :
# Option 1 (Recommandée & sécurisée pour production, évite d'écrire le mot de passe dans git) :
#   Exécuter dans votre terminal : npx wrangler secret put GMAIL_APP_PWD
# Option 2 (Si votre dépôt GitHub est privé et que vous souhaitez le mettre directement ici) :
#   Décommentez l'une des variables ci-dessous et remplacez par votre code d'application à 16 lettres :
# GMAIL_APP_PWD = "votre_mot_de_passe_app_16_caracteres"
# MAIL_APP_PWD = "votre_mot_de_passe_app_16_caracteres"

# Clé secrète de gestion auteur / Back-Office (gérée au niveau serveur) :
# Option 1 (Recommandée pour production via secret chiffré Cloudflare) :
#   npx wrangler secret put ADMIN_SECRET
# Option 2 (Si dépôt privé) : Décommentez et définissez votre clé secrète ci-dessous :
# ADMIN_SECRET = "votre_cle_secrete_auteur"