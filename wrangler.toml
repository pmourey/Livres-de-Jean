name = "livres-de-jean-payments"
main = "src/worker.ts"
compatibility_date = "2026-05-03"

[[d1_databases]]
binding = "DB"
database_name = "livres_de_jean"
database_id = "16181fe9-b0a5-4f20-979b-68c745f2c03d"

[[r2_buckets]]
binding = "PDFS"
bucket_name = "ebooks-jean"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ebooks-jean"

[vars]
PAYPAL_API_BASE="https://api-m.paypal.com"
SITE_URL = "https://pmourey.github.io/Livres-de-Jean"
STRIPE_RETURN_URL = "https://pmourey.github.io/Livres-de-Jean/?payment=stripe-success"
STRIPE_CANCEL_URL = "https://pmourey.github.io/Livres-de-Jean/?payment=stripe-cancel"
# PAYPAL_RETURN_URL = "https://livres-de-jean-payments.super-violet-dc40.workers.dev/checkout/paypal/complete"
PAYPAL_RETURN_URL = "https://livres-de-jean-payments.super-violet-dc40.workers.dev/checkout/paypal/complete"
PAYPAL_SUCCESS_URL = "https://pmourey.github.io/Livres-de-Jean/"

# Configuration SMTP Gmail pour envois de codes OTP et récapitulatifs de commande
SMTP_SERVER = "smtp.gmail.com"
SMTP_PORT = "465"
GMAIL_FULLNAME = "Philippe Mourey"
GMAIL_USER = "philippe.mourey@gmail.com"
# Recommandation : en production publique, définir via 'npx wrangler secret put GMAIL_APP_PWD'